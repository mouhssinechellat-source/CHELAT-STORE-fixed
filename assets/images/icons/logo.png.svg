<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141c"/>
      <stop offset="1" stop-color="#2b0d3d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9bff"/>
      <stop offset="0.5" stop-color="#b44cff"/>
      <stop offset="1" stop-color="#ff7ab0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3b8ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b44cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b44cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>

  <!-- Globe wireframe -->
  <g fill="none" stroke="#7fb4ff" stroke-width="5" opacity="0.35">
    <circle cx="512" cy="512" r="300"/>
    <ellipse cx="512" cy="512" rx="150" ry="300"/>
    <ellipse cx="512" cy="512" rx="255" ry="300"/>
    <line x1="512" y1="212" x2="512" y2="812"/>
    <line x1="212" y1="512" x2="812" y2="512"/>
    <path d="M250 360 Q512 430 774 360"/>
    <path d="M250 664 Q512 594 774 664"/>
  </g>

  <!-- Neon ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#ring)" stroke-width="16" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="352" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.5"/>

  <!-- Orbit nodes -->
  <g filter="url(#glow)">
    <circle cx="512" cy="132" r="11" fill="#4f9bff"/>
    <circle cx="892" cy="512" r="11" fill="#ff7ab0"/>
    <circle cx="512" cy="892" r="11" fill="#b44cff"/>
    <circle cx="132" cy="512" r="11" fill="#4f9bff"/>
  </g>

  <!-- Paper plane (top right) -->
  <g transform="translate(655 235) rotate(8)" filter="url(#glow)" fill="#ffffff">
    <path d="M0 40 L110 0 L88 108 L55 78 L38 100 L34 66 Z"/>
  </g>

  <!-- Play button (bottom left) -->
  <g transform="translate(262 668)" filter="url(#glow)" fill="none" stroke="#e3b8ff" stroke-width="7" stroke-linejoin="round">
    <rect x="0" y="0" width="84" height="60" rx="18"/>
    <path d="M34 16 L58 30 L34 44 Z" fill="#e3b8ff"/>
  </g>

  <!-- Heart (bottom right) -->
  <g transform="translate(676 668)" filter="url(#glow)" fill="none" stroke="#ff7ab0" stroke-width="7" stroke-linejoin="round">
    <path d="M42 70 C-10 34 10 -6 42 20 C74 -6 94 34 42 70 Z"/>
  </g>

  <!-- CM lettering -->
  <g filter="url(#softglow)">
    <text x="512" y="590" text-anchor="middle"
          font-family="'Montserrat','Poppins','Segoe UI','Arial Black',Arial,sans-serif"
          font-size="270" font-weight="900" letter-spacing="6"
          fill="url(#txt)" stroke="#b44cff" stroke-width="2">CM</text>
  </g>

  <!-- Tagline -->
  <text x="512" y="672" text-anchor="middle"
        font-family="'Montserrat','Poppins','Segoe UI',Arial,sans-serif"
        font-size="30" font-weight="600" letter-spacing="14" fill="#c9b6ff" opacity="0.85">DIGITAL BRAND</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
